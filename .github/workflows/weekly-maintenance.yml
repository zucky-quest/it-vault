name: Weekly maintenance

on:
  schedule:
    # GitHub Actions cron is UTC: Saturday 09:30 JST is Saturday 00:30 UTC.
    - cron: "30 0 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    name: Run Betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history with Betterleaks
        env:
          BETTERLEAKS_VERSION: "1.8.1"
        run: |
          set -euo pipefail
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" betterleaks
          ./betterleaks git . --redact --no-banner --platform github --config .betterleaks.toml

  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
