name: Weekly maintenance

on:
  schedule:
    # GitHub Actions cron is UTC: Saturday 09:30 JST is Saturday 00:30 UTC.
    - cron: "30 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  betterleaks:
    name: Run Betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Scan repository with Betterleaks
        uses: docker://ghcr.io/betterleaks/betterleaks:latest
        with:
          args: git /github/workspace -v

  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
